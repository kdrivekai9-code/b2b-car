name: Playwright E2E

on:
  pull_request:
    paths:
      - 'tests/manual/**'
      - 'public/js/**'
      - 'routes/**'
      - 'views/orders/**'
      - 'lib/**'
      - 'middleware/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-e2e.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Preflight/E2E 대상 URL'
        required: false
        default: 'http://127.0.0.1:3000'
      # 수동 실행에서도 QA 계정이 미리 채워져야 한다. 「Run workflow」를 눌렀을 때 admin이
      # 들어가 있으면, 아무것도 안 바꾸고 실행한 사람이 실사용 계정을 로그아웃시킨다.
      # 일부러 실계정을 점검하려면 여기 직접 적고 ALLOW_NON_QA_LOGIN=1을 함께 줘야 한다.
      login_id_admin:
        description: '관리자 로그인 ID (QA 전용 계정)'
        required: false
        default: 'qa_test_bot'
      login_id_branch_manager:
        description: '지사장 로그인 ID (QA 전용 계정)'
        required: false
        default: 'qa_test_branch_manager'
      login_id_client:
        description: '고객사 로그인 ID (QA 전용 계정)'
        required: false
        default: 'qa_test_client'
      login_password_admin:
        description: '관리자 비밀번호(선택: 미입력 시 secret 우선)'
        required: false
        default: ''
      login_password_branch_manager:
        description: '지사장 비밀번호(선택: 미입력 시 secret 우선)'
        required: false
        default: ''
      login_password_client:
        description: '고객사 비밀번호(선택: 미입력 시 secret 우선)'
        required: false
        default: ''
      test_session_create_limit:
        description: '테스트 전용 세션 생성 한도(시간당, 숫자)'
        required: false
        default: '200'

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET != '' && secrets.SESSION_SECRET || 'ci-session-secret' }}
      TEST_SESSION_CREATE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_session_create_limit != '' && github.event.inputs.test_session_create_limit || vars.TEST_SESSION_CREATE_LIMIT != '' && vars.TEST_SESSION_CREATE_LIMIT || '200' }}
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      E2E_BASE_URL: http://127.0.0.1:3000
      LOGIN_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || 'http://127.0.0.1:3000' }}
      # 자동화는 QA 전용 계정만 쓴다. 예전 기본값(admin / seoul_manager / seoulmotors)은
      # 사람이 실제로 쓰는 계정이고, 로그인은 단일 세션이라 이 잡이 돌면 그 계정을 쓰던 사람이
      # 로그아웃된다 — 2026-08-25에 실제로 났다(접속기록에 admin LOGIN_BLOCKED 5건).
      #
      # 푸시마다 돌리려면 낮에도 돌아야 하고, 낮에 실사용 계정으로 로그인하면 작업 중인 사람을
      # 계속 튕겨낸다. 계정을 옮기는 것이 그 전제조건이다.
      #
      # 비밀번호 폴백('Admin!2345' 같은 값)도 없앴다. 시크릿이 없으면 조용히 틀린 값으로 로그인을
      # 반복해 계정이 로그인 제한에 걸린다. 지금은 scripts/check-login-all.js가 시도 전에 멈춘다.
      LOGIN_ID_ADMIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_id_admin || 'qa_test_bot' }}
      LOGIN_ID_BRANCH_MANAGER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_id_branch_manager || 'qa_test_branch_manager' }}
      LOGIN_ID_CLIENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_id_client || 'qa_test_client' }}
      LOGIN_PASSWORD_ADMIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_password_admin != '' && github.event.inputs.login_password_admin || secrets.LOGIN_PASSWORD_ADMIN != '' && secrets.LOGIN_PASSWORD_ADMIN }}
      LOGIN_PASSWORD_BRANCH_MANAGER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_password_branch_manager != '' && github.event.inputs.login_password_branch_manager || secrets.LOGIN_PASSWORD_BRANCH_MANAGER != '' && secrets.LOGIN_PASSWORD_BRANCH_MANAGER }}
      LOGIN_PASSWORD_CLIENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_password_client != '' && github.event.inputs.login_password_client || secrets.LOGIN_PASSWORD_CLIENT != '' && secrets.LOGIN_PASSWORD_CLIENT }}

    steps:
      - name: Checkout
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: npm ci

      - name: Print DATABASE_URL host/port (safe)
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL); console.log('DB host:', u.hostname); console.log('DB port:', u.port || '(default)'); console.log('DB uses pooler:', u.hostname.includes('pooler.supabase.com'));"

      - name: Install Playwright browsers
        if: ${{ env.DATABASE_URL != '' }}
        run: npx playwright install --with-deps chromium

      - name: Seed demo data
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run seed

      - name: Clear test chat sessions
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          node -e "
            require('dotenv').config();
            const { pool, run } = require('./db');
            run('DELETE FROM chat_sessions')
              .then(() => console.log('chat_sessions 정리 완료'))
              .catch(e => { console.error('chat_sessions 정리 실패:', e.message); process.exit(1); })
              .finally(() => pool.end());
          "

      - name: Start server
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          cat server.log || true
          exit 1

      - name: Run preflight login gate
        if: ${{ env.DATABASE_URL != '' }}
        env:
          PREFLIGHT_REPORT_PATH: artifacts/preflight-report.json
          PREFLIGHT_SUMMARY_PATH: artifacts/preflight-summary.md
        run: npm run check:preflight

      - name: Write test session limit summary
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          {
            echo "### Test session create limit"
            echo
            echo "- TEST_SESSION_CREATE_LIMIT: ${TEST_SESSION_CREATE_LIMIT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Playwright test (except chat-admin)
        if: ${{ env.DATABASE_URL != '' }}
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/manual --reporter=line --workers=1 --pass-with-no-tests --grep-invert "Chat admin card messaging|AI intake"

      - name: Run Playwright test (chat-admin isolated account)
        if: ${{ env.DATABASE_URL != '' }}
        env:
          E2E_LOGIN_ID: ${{ env.LOGIN_ID_ADMIN }}
          E2E_PASSWORD: ${{ env.LOGIN_PASSWORD_ADMIN }}
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/manual/chat-admin-card-messaging.playwright.spec.js --reporter=line --workers=1

      - name: Upload server log on failure
        if: ${{ failure() && env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: server-log
          path: server.log

      - name: Upload preflight report
        if: ${{ always() && env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: preflight-report
          path: artifacts/preflight-report.json
          if-no-files-found: warn

      - name: Upload preflight summary
        if: ${{ always() && env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: preflight-summary
          path: artifacts/preflight-summary.md
          if-no-files-found: warn

      - name: Stop server
        if: ${{ always() && env.DATABASE_URL != '' }}
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Skip message
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL secret is not configured."
          echo "Playwright E2E job was skipped."

  e2e-ai-intake:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET != '' && secrets.SESSION_SECRET || 'ci-session-secret' }}
      TEST_SESSION_CREATE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_session_create_limit != '' && github.event.inputs.test_session_create_limit || vars.TEST_SESSION_CREATE_LIMIT != '' && vars.TEST_SESSION_CREATE_LIMIT || '200' }}
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_LOGIN_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_id_branch_manager || 'qa_test_branch_manager' }}
      E2E_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_password_branch_manager != '' && github.event.inputs.login_password_branch_manager || secrets.LOGIN_PASSWORD_BRANCH_MANAGER != '' && secrets.LOGIN_PASSWORD_BRANCH_MANAGER }}
      LOGIN_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || 'http://127.0.0.1:3000' }}
      LOGIN_ID_ADMIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_id_branch_manager || 'qa_test_branch_manager' }}
      LOGIN_ID_BRANCH_MANAGER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_id_branch_manager || 'qa_test_branch_manager' }}
      LOGIN_ID_CLIENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_id_client || 'qa_test_client' }}
      LOGIN_PASSWORD_ADMIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_password_branch_manager != '' && github.event.inputs.login_password_branch_manager || secrets.LOGIN_PASSWORD_BRANCH_MANAGER != '' && secrets.LOGIN_PASSWORD_BRANCH_MANAGER }}
      LOGIN_PASSWORD_BRANCH_MANAGER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_password_branch_manager != '' && github.event.inputs.login_password_branch_manager || secrets.LOGIN_PASSWORD_BRANCH_MANAGER != '' && secrets.LOGIN_PASSWORD_BRANCH_MANAGER }}
      LOGIN_PASSWORD_CLIENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.login_password_client != '' && github.event.inputs.login_password_client || secrets.LOGIN_PASSWORD_CLIENT != '' && secrets.LOGIN_PASSWORD_CLIENT }}

    steps:
      - name: Checkout
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ env.DATABASE_URL != '' }}
        run: npx playwright install --with-deps chromium

      - name: Seed demo data
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run seed

      - name: Clear test chat sessions
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          node -e "
            require('dotenv').config();
            const { pool, run } = require('./db');
            run('DELETE FROM chat_sessions')
              .then(() => console.log('chat_sessions 정리 완료'))
              .catch(e => { console.error('chat_sessions 정리 실패:', e.message); process.exit(1); })
              .finally(() => pool.end());
          "

      - name: Start server
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          cat server.log || true
          exit 1

      - name: Run preflight login gate
        if: ${{ env.DATABASE_URL != '' }}
        env:
          PREFLIGHT_REPORT_PATH: artifacts/preflight-ai-intake-report.json
          PREFLIGHT_SUMMARY_PATH: artifacts/preflight-ai-intake-summary.md
        run: npm run check:preflight

      - name: Write test session limit summary
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          {
            echo "### Test session create limit"
            echo
            echo "- TEST_SESSION_CREATE_LIMIT: ${TEST_SESSION_CREATE_LIMIT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run AI intake Playwright bundle
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run e2e:ai-intake

      - name: Upload server log on failure
        if: ${{ failure() && env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: server-log-ai-intake
          path: server.log

      - name: Upload preflight report
        if: ${{ always() && env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: preflight-ai-intake-report
          path: artifacts/preflight-ai-intake-report.json
          if-no-files-found: warn

      - name: Upload preflight summary
        if: ${{ always() && env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: preflight-ai-intake-summary
          path: artifacts/preflight-ai-intake-summary.md
          if-no-files-found: warn

      - name: Stop server
        if: ${{ always() && env.DATABASE_URL != '' }}
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Skip message
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL secret is not configured."
          echo "AI intake Playwright E2E job was skipped."
